services:
  - type: web
    name: smart-hospital-backend
    env: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "smart-hospital-backend.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://your-frontend.vercel.app"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://your-frontend.vercel.app"
      - key: AI_PROVIDER
        value: "local"
      - key: DATABASE_URL
        fromDatabase:
          name: smart-hospital-db
          property: connectionString

databases:
  - name: smart-hospital-db
    plan: free
    region: oregon